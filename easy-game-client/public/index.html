<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Easy Game 🎰</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .machine {
      background: linear-gradient(145deg, #2d2d44, #1a1a2e);
      border-radius: 24px;
      padding: 40px;
      width: 380px;
      box-shadow: 0 0 60px rgba(255, 200, 0, 0.15), 0 20px 60px rgba(0,0,0,0.5);
      border: 2px solid rgba(255, 200, 0, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 8px;
      color: #ffc800;
      text-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: #888;
    }

    .status-bar span { color: #aaa; }
    .status-bar span.connected { color: #4caf50; }
    .status-bar span.disconnected { color: #f44336; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 16px;
      border: 2px solid rgba(255,255,255,0.05);
      position: relative;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cell {
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      font-size: 2.2rem;
      text-align: center;
      padding: 12px 0;
      transition: transform 0.2s, background 0.2s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .row.middle .cell {
      background: rgba(255, 200, 0, 0.08);
      border-color: rgba(255, 200, 0, 0.25);
    }

    .cell.win {
      background: rgba(255, 200, 0, 0.2) !important;
      border-color: #ffc800 !important;
      transform: scale(1.08);
      box-shadow: 0 0 16px rgba(255, 200, 0, 0.5);
    }

    .spinning .cell {
      animation: spin-cell 0.1s infinite alternate;
    }

    @keyframes spin-cell {
      from { transform: scaleY(1); opacity: 1; }
      to   { transform: scaleY(0.85); opacity: 0.6; }
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bet-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bet-row label { flex: 1; color: #aaa; font-size: 0.9rem; }

    .bet-row input {
      width: 80px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-row label { flex: 1; color: #aaa; font-size: 0.9rem; }

    .player-row input {
      width: 130px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.9rem;
    }

    .spin-btn {
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ffc800, #ff9500);
      color: #1a1a2e;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(255, 200, 0, 0.3);
      letter-spacing: 1px;
    }

    .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,200,0,0.45); }
    .spin-btn:active { transform: translateY(0); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Result */
    .result {
      margin-top: 16px;
      text-align: center;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .result .label {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .result .label.win  { color: #ffc800; text-shadow: 0 0 12px rgba(255,200,0,0.6); }
    .result .label.lose { color: #888; }

    .result .payout {
      font-size: 1rem;
      color: #aaa;
    }

    .result .payout strong { color: #4caf50; }
  </style>
</head>
<body>
<div class="machine">
  <h1>🎰 Easy Game</h1>

  <div class="status-bar">
    <span>Engine:</span>
    <span id="conn-status" class="disconnected">Disconnected</span>
  </div>

  <div class="grid" id="grid">
    <div class="row" id="row-0">
      <div class="cell" id="c-0-0">❓</div>
      <div class="cell" id="c-0-1">❓</div>
      <div class="cell" id="c-0-2">❓</div>
    </div>
    <div class="row middle" id="row-1">
      <div class="cell" id="c-1-0">❓</div>
      <div class="cell" id="c-1-1">❓</div>
      <div class="cell" id="c-1-2">❓</div>
    </div>
    <div class="row" id="row-2">
      <div class="cell" id="c-2-0">❓</div>
      <div class="cell" id="c-2-1">❓</div>
      <div class="cell" id="c-2-2">❓</div>
    </div>
  </div>

  <div class="controls">
    <div class="player-row">
      <label>Player ID</label>
      <input id="player-id" type="text" value="user1" />
    </div>
    <div class="bet-row">
      <label>Bet</label>
      <input id="bet" type="number" value="10" min="1" />
    </div>
    <button class="spin-btn" id="spin-btn" onclick="doSpin()">SPIN ▶</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
  const SYMBOLS = ['🍒','🍋','🍊','🍇','⭐'];
  const socket = io('http://localhost:3000');

  socket.on('connect', () => {
    document.getElementById('conn-status').textContent = 'Connected ✓';
    document.getElementById('conn-status').className = 'connected';
    document.getElementById('spin-btn').disabled = false;
  });

  socket.on('disconnect', () => {
    document.getElementById('conn-status').textContent = 'Disconnected';
    document.getElementById('conn-status').className = 'disconnected';
    document.getElementById('spin-btn').disabled = true;
  });

  socket.on('spin_result', (data) => {
    stopSpinAnimation();
    renderGrid(data.grid, data.win);
    renderResult(data.win, data.payout);
    document.getElementById('spin-btn').disabled = false;
  });

  function doSpin() {
    const playerId = document.getElementById('player-id').value || 'user1';
    const bet = parseInt(document.getElementById('bet').value) || 10;

    document.getElementById('spin-btn').disabled = true;
    document.getElementById('result').innerHTML = '';
    startSpinAnimation();

    socket.emit('spin', JSON.stringify({ playerId, bet }));
  }

  function renderGrid(grid, win) {
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const cell = document.getElementById(`c-${r}-${c}`);
        cell.textContent = grid[r][c];
        cell.classList.remove('win');
        if (win && r === 1) cell.classList.add('win');
      }
    }
  }

  function renderResult(win, payout) {
    const el = document.getElementById('result');
    if (win) {
      el.innerHTML = `
        <div class="label win">🎉 WIN!</div>
        <div class="payout">Payout: <strong>+${payout}</strong></div>
      `;
    } else {
      el.innerHTML = `<div class="label lose">No luck this time…</div>`;
    }
  }

  let spinInterval = null;

  function startSpinAnimation() {
    const grid = document.getElementById('grid');
    grid.classList.add('spinning');
    spinInterval = setInterval(() => {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          document.getElementById(`c-${r}-${c}`).textContent =
            SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }
      }
    }, 80);
  }

  function stopSpinAnimation() {
    document.getElementById('grid').classList.remove('spinning');
    clearInterval(spinInterval);
  }
</script>
</body>
</html>
